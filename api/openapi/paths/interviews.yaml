collection:
  parameters:
    - name: applicationId
      in: path
      required: true
      schema:
        $ref: ../components/common.yaml#/schemas/Uuid
  get:
    operationId: listInterviewRounds
    tags: [Interview]
    summary: List interview rounds for one application.
    parameters:
      - $ref: ../components/common.yaml#/parameters/Cursor
      - $ref: ../components/common.yaml#/parameters/Limit
    responses:
      "200":
        description: Cursor page of interview rounds.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-pages.yaml#/schemas/InterviewRoundList
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
  post:
    operationId: createInterviewRound
    tags: [Interview]
    summary: Add an interview round.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/tracker-child.yaml#/schemas/InterviewRoundWriteRequest
    responses:
      "201":
        description: Created interview round.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/InterviewRound
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict
      "422":
        $ref: ../components/common.yaml#/responses/UnprocessableEntity

item:
  parameters:
    - name: applicationId
      in: path
      required: true
      schema:
        $ref: ../components/common.yaml#/schemas/Uuid
    - name: interviewId
      in: path
      required: true
      schema:
        $ref: ../components/common.yaml#/schemas/Uuid
  get:
    operationId: getInterviewRound
    tags: [Interview]
    summary: Read an interview round.
    responses:
      "200":
        description: Interview round.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/InterviewRound
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
  put:
    operationId: replaceInterviewRound
    tags: [Interview]
    summary: Replace an interview round using optimistic locking.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/tracker-pages.yaml#/schemas/InterviewRoundUpdateRequest
    responses:
      "200":
        description: Updated interview round.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/InterviewRound
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict
  delete:
    operationId: deleteInterviewRound
    tags: [Interview]
    summary: Soft-delete an interview round.
    parameters:
      - $ref: ../components/common.yaml#/parameters/ExpectedVersion
    responses:
      "200":
        description: Deleted interview round tombstone.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/InterviewRound
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict

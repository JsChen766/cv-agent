collection:
  get:
    operationId: listExperiences
    tags:
      - Experience
    summary: Search the current user's experiences.
    parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          $ref: ../components/experience.yaml#/schemas/ExperienceCategory
      - name: tags
        in: query
        description: All supplied tags must match after Unicode NFKC, trim, and lowercase normalization.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        description: Defaults to active. Archived experiences require an explicit archived filter.
        schema:
          type: string
          enum:
            - active
            - archived
          default: active
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      - name: cursor
        in: query
        schema:
          type: string
    responses:
      "200":
        description: Cursor page of experience summaries.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/experience.yaml#/schemas/ExperienceList
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
  post:
    operationId: createExperience
    tags:
      - Experience
    summary: Create an experience and its initial revision.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/experience.yaml#/schemas/ExperienceCreateRequest
    responses:
      "201":
        description: Created experience summary.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/experience.yaml#/schemas/ExperienceSummary
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "422":
        $ref: ../components/common.yaml#/responses/UnprocessableEntity

item:
  parameters:
    - name: experienceId
      in: path
      required: true
      schema:
        $ref: ../components/common.yaml#/schemas/Uuid
  get:
    operationId: getExperience
    tags:
      - Experience
    summary: Read an experience with revisions.
    responses:
      "200":
        description: Full experience detail.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/experience.yaml#/schemas/ExperienceDetail
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
  put:
    operationId: updateExperience
    tags:
      - Experience
    summary: Fully replace current fields and append an immutable revision only when content changes.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/experience-write.yaml#/schemas/ExperienceUpdateRequest
    responses:
      "200":
        description: Updated experience detail.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/experience.yaml#/schemas/ExperienceDetail
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict
      "422":
        $ref: ../components/common.yaml#/responses/UnprocessableEntity
  delete:
    operationId: deleteExperience
    tags:
      - Experience
    summary: Soft-delete an experience and return its tombstone projection.
    parameters:
      - $ref: ../components/common.yaml#/parameters/ExpectedVersion
    responses:
      "200":
        description: Deleted experience tombstone.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/experience.yaml#/schemas/ExperienceSummary
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict

revisions:
  parameters:
    - name: experienceId
      in: path
      required: true
      schema:
        $ref: ../components/common.yaml#/schemas/Uuid
  get:
    operationId: listExperienceRevisions
    tags:
      - Experience
    summary: List immutable content revisions newest first.
    parameters:
      - $ref: ../components/common.yaml#/parameters/Cursor
      - $ref: ../components/common.yaml#/parameters/Limit
    responses:
      "200":
        description: Cursor page of revisions.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/experience-write.yaml#/schemas/ExperienceRevisionList
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound

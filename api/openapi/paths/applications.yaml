collection:
  get:
    operationId: listApplications
    tags: [Application]
    summary: List or query the current user's tracker board.
    parameters:
      - name: status
        in: query
        schema:
          $ref: ../components/application.yaml#/schemas/ApplicationStatus
      - name: company
        in: query
        schema:
          type: string
      - name: jdId
        in: query
        schema:
          $ref: ../components/common.yaml#/schemas/Uuid
      - name: resumeId
        in: query
        schema:
          $ref: ../components/common.yaml#/schemas/Uuid
      - name: pendingConfirmation
        in: query
        schema:
          type: boolean
      - $ref: ../components/common.yaml#/parameters/Cursor
      - $ref: ../components/common.yaml#/parameters/Limit
    responses:
      "200":
        description: Cursor page of applications.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/application.yaml#/schemas/ApplicationList
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
  post:
    operationId: createApplication
    tags: [Application]
    summary: Record a completed or pending-confirmation application.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/application.yaml#/schemas/ApplicationCreateRequest
    responses:
      "201":
        description: Created application.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/application.yaml#/schemas/Application
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "409":
        $ref: ../components/common.yaml#/responses/Conflict
      "422":
        $ref: ../components/common.yaml#/responses/UnprocessableEntity

item:
  parameters:
    - name: applicationId
      in: path
      required: true
      schema:
        $ref: ../components/common.yaml#/schemas/Uuid
  get:
    operationId: getApplication
    tags: [Application]
    summary: Read an application.
    responses:
      "200":
        description: Application detail.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/application.yaml#/schemas/Application
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
  put:
    operationId: updateApplication
    tags: [Application]
    summary: Update tracker metadata without changing status.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/application.yaml#/schemas/ApplicationUpdateRequest
    responses:
      "200":
        description: Updated application.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/application.yaml#/schemas/Application
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict
      "422":
        $ref: ../components/common.yaml#/responses/UnprocessableEntity
  delete:
    operationId: deleteApplication
    tags: [Application]
    summary: Soft-delete an application.
    parameters:
      - $ref: ../components/common.yaml#/parameters/ExpectedVersion
    responses:
      "200":
        description: Deleted application tombstone.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/application.yaml#/schemas/Application
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict

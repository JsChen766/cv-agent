collection:
  parameters:
    - name: applicationId
      in: path
      required: true
      schema:
        $ref: ../components/common.yaml#/schemas/Uuid
  get:
    operationId: listApplicationNotes
    tags: [Note]
    summary: List notes for one application.
    parameters:
      - $ref: ../components/common.yaml#/parameters/Cursor
      - $ref: ../components/common.yaml#/parameters/Limit
    responses:
      "200":
        description: Cursor page of notes.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-pages.yaml#/schemas/ApplicationNoteList
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
  post:
    operationId: createApplicationNote
    tags: [Note]
    summary: Add an application or interview note.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/tracker-child.yaml#/schemas/ApplicationNoteWriteRequest
    responses:
      "201":
        description: Created note.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/ApplicationNote
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "422":
        $ref: ../components/common.yaml#/responses/UnprocessableEntity

item:
  parameters:
    - name: applicationId
      in: path
      required: true
      schema:
        $ref: ../components/common.yaml#/schemas/Uuid
    - name: noteId
      in: path
      required: true
      schema:
        $ref: ../components/common.yaml#/schemas/Uuid
  get:
    operationId: getApplicationNote
    tags: [Note]
    summary: Read a note.
    responses:
      "200":
        description: Application note.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/ApplicationNote
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
  put:
    operationId: replaceApplicationNote
    tags: [Note]
    summary: Replace a note using optimistic locking.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/tracker-pages.yaml#/schemas/ApplicationNoteUpdateRequest
    responses:
      "200":
        description: Updated note.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/ApplicationNote
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict
  delete:
    operationId: deleteApplicationNote
    tags: [Note]
    summary: Soft-delete a note.
    parameters:
      - $ref: ../components/common.yaml#/parameters/ExpectedVersion
    responses:
      "200":
        description: Deleted note tombstone.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/ApplicationNote
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict

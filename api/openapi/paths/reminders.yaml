collection:
  get:
    operationId: listReminders
    tags: [Reminder]
    summary: List synchronized reminders; the APP triggers local notifications.
    parameters:
      - name: applicationId
        in: query
        schema:
          $ref: ../components/common.yaml#/schemas/Uuid
      - name: status
        in: query
        schema:
          type: string
          enum: [scheduled, delivered, dismissed, canceled]
      - $ref: ../components/common.yaml#/parameters/Cursor
      - $ref: ../components/common.yaml#/parameters/Limit
    responses:
      "200":
        description: Cursor page of reminders.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-pages.yaml#/schemas/ReminderList
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
  post:
    operationId: createReminder
    tags: [Reminder]
    summary: Create a synchronized reminder.
    parameters:
      - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/tracker-child.yaml#/schemas/ReminderWriteRequest
    responses:
      "201":
        description: Created reminder.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/Reminder
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "422":
        $ref: ../components/common.yaml#/responses/UnprocessableEntity

item:
  parameters:
    - name: reminderId
      in: path
      required: true
      schema:
        $ref: ../components/common.yaml#/schemas/Uuid
  get:
    operationId: getReminder
    tags: [Reminder]
    summary: Read a reminder.
    responses:
      "200":
        description: Reminder.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/Reminder
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
  put:
    operationId: replaceReminder
    tags: [Reminder]
    summary: Replace a reminder using optimistic locking.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/tracker-pages.yaml#/schemas/ReminderUpdateRequest
    responses:
      "200":
        description: Updated reminder.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/Reminder
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict
  delete:
    operationId: deleteReminder
    tags: [Reminder]
    summary: Soft-delete a reminder.
    parameters:
      - $ref: ../components/common.yaml#/parameters/ExpectedVersion
    responses:
      "200":
        description: Deleted reminder tombstone.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/common.yaml#/schemas/SuccessEnvelope
                - type: object
                  properties:
                    data:
                      $ref: ../components/tracker-child.yaml#/schemas/Reminder
      "401":
        $ref: ../components/common.yaml#/responses/Unauthorized
      "404":
        $ref: ../components/common.yaml#/responses/NotFound
      "409":
        $ref: ../components/common.yaml#/responses/Conflict

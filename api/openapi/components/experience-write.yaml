schemas:
  ExperienceUpdateRequest:
    type: object
    additionalProperties: false
    required:
      - expectedVersion
      - category
      - title
      - content
      - organization
      - role
      - location
      - start_date
      - end_date
      - tags
      - resumeSectionKey
      - resumeSectionLabel
      - status
      - revisionSource
    properties:
      expectedVersion:
        $ref: ./common.yaml#/schemas/EntityVersion
      category:
        $ref: ./experience.yaml#/schemas/ExperienceCategory
      title:
        type: string
        minLength: 1
        maxLength: 200
      content:
        type: string
        minLength: 1
      organization:
        type: [string, "null"]
        maxLength: 200
      role:
        type: [string, "null"]
        maxLength: 200
      location:
        type: [string, "null"]
        maxLength: 200
      start_date:
        $ref: ./experience.yaml#/schemas/ExperienceStartDate
      end_date:
        $ref: ./experience.yaml#/schemas/ExperienceEndDate
      tags:
        type: array
        items:
          type: string
      resumeSectionKey:
        type: [string, "null"]
        pattern: '^[a-z][a-z0-9-]{0,63}$'
      resumeSectionLabel:
        type: [string, "null"]
        minLength: 1
        maxLength: 120
      status:
        type: string
        enum:
          - active
          - archived
      revisionSource:
        type: string
        enum:
          - manual
          - import
          - app_generated
        default: manual
      revisionId:
        oneOf:
          - $ref: ./common.yaml#/schemas/Uuid
          - type: "null"
        description: Optional stable client-generated ID used only when content changes.
  ExperienceRevisionList:
    type: object
    required:
      - items
      - nextCursor
    properties:
      items:
        type: array
        items:
          $ref: ./experience.yaml#/schemas/ExperienceRevision
      nextCursor:
        $ref: ./common.yaml#/schemas/Cursor

root = "."
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/api ./cmd/api"
entrypoint = ["./tmp/air/api"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "vendor", "docs"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
